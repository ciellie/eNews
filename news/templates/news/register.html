{% extends "news/base.html" %}


{% block title %}
    Register
{% endblock %}


{% block content %}

    <div class="login-box">

        <h2>
            Create Account
        </h2>

        <p>
            Create a Reader account to access
            the eNews application.
        </p>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="primary-button"
            >
                Register
            </button>

        </form>


        <p>
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

{% endblock %}
