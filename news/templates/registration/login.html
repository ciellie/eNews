{% extends "news/base.html" %}


{% block title %}
    Login
{% endblock %}


{% block content %}

    <div class="login-box">

        <h2>
            Login
        </h2>

        {% if form.errors %}

            <div class="error-message">
                Incorrect username or password.
            </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

            {% if next %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

            {% endif %}

        </form>

    </div>

{% endblock %}
